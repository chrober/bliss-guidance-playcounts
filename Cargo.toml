[package]
name = "bliss-guidance-playcounts"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Guidance addon supplying LMS play-count preferences to Bliss playlist optimization"
repository = "https://github.com/chrober/bliss-guidance-playcounts"
publish = false

[dependencies]
bliss-playlist-guidance-spi = { git = "https://github.com/chrober/bliss-playlist-guidance-spi.git", rev = "ec385df" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
